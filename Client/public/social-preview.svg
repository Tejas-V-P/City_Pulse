<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="10%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffb020" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="95%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#4de8d0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4de8d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8940a"/>
      <stop offset="55%" stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#ffc85c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0c12"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <text x="90" y="300" font-family="'Space Grotesk', Arial, sans-serif" font-size="88" font-weight="700" fill="url(#wordmark)" letter-spacing="-2">City Pulse</text>
  <text x="92" y="360" font-family="Inter, Arial, sans-serif" font-size="30" fill="#9a9ca8">Discover &amp; organise events happening around you</text>

  <!-- signature heartbeat / pulse line -->
  <path d="M90,460 L330,460 L360,410 L400,510 L440,460 L1110,460"
        fill="none" stroke="#ffb020" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M90,460 L330,460 L360,410 L400,510 L440,460 L1110,460"
        fill="none" stroke="#4de8d0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" transform="translate(0,6)"/>
</svg>
